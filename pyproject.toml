[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discuss"
version = "0.1.0"
description = "Single-trigger assisted discussion-post draft pipeline for the UOPX student portal."
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "selectolax",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
discuss = "discuss.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["discuss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
